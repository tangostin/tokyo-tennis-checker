# STREAMING_CHUNK:Checking out the repository code...
- name: Checkout repository
  uses: actions/checkout@v4
  with:
    persist-credentials: true

# STREAMING_CHUNK:Setting up Node.js environment...
- name: Set up Node.js
  uses: actions/setup-node@v4
  with:
    node-version: '20'

# STREAMING_CHUNK:Installing dependencies...
- name: Install dependencies
  run: npm install

# STREAMING_CHUNK:Installing Playwright Chromium browser...
- name: Install Playwright Browsers
  run: npx playwright install chromium

# STREAMING_CHUNK:Running the tennis check script...
- name: Run checker
  env:
    NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
    GMAIL_USER: ${{ secrets.GMAIL_USER }}
    GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
  # 実行するJSのファイル名に合わせて指定します（デフォルトは index.js）
  run: tennis-checker index.js

# STREAMING_CHUNK:Committing and pushing updated state file...
- name: Commit and Push if last_vacant.txt changed
  run: |
    git config --local user.email "github-actions[bot]@users.noreply.github.com"
    git config --local user.name "github-actions[bot]"
    if [ -f last_vacant.txt ]; then
      git add last_vacant.txt
      if ! git diff --quiet || ! git diff --staged --quiet; then
        git commit -m "Update last vacant cache [skip ci]"
        git pull --rebase origin ${{ github.ref_name }}
        git push
      else
        echo "No changes in last_vacant.txt"
      fi
    fi
